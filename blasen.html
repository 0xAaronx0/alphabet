<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buchstaben Blasen!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #c7e8fb 0%, #e8f6ff 55%, #fdeede 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(43, 84, 126, 0.22);
            touch-action: none;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;

function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.97;
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ── Konstanten ─────────────────────────────────────────────────────────────
const GROUND     = H - 60;
const BLASE_R    = 48;
const ZIEL_PRO_LEVEL = 15;
const GLOW_UNTIL = 6;

// Runde, freundliche Schrift — auf iOS/macOS vorinstalliert, sonst weicher Fallback
const SCHRIFT = '"Arial Rounded MT Bold", "Nunito", "Quicksand", "Trebuchet MS", sans-serif';

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ZAHLEN   = Array.from({length: 21}, (_, i) => String(i)); // 0–20
// Kräftige, freundliche Töne — weiße Schrift bleibt auf jeder Blase lesbar
const FARBEN   = [
    '#FF6B6B','#4ECDC4','#45B7D1','#FFA94D','#82C91E',
    '#CC5DE8','#F59F00','#4DABF7','#F783AC','#38D9A9',
    '#FF8787','#22B8CF','#5C7CFA','#20C997','#51CF66',
    '#FAB005','#BE4BDB','#3B82F6','#E64980','#40C057',
    '#FF922B','#748FFC','#3BC9DB','#F06595','#69DB7C',
    '#DA77F2'
];
const ZAHLEN_FARBEN = FARBEN.slice(0, 21);

// ── Sprache: ausschließlich Deutsch ───────────────────────────────────────
const synth = window.speechSynthesis;
let deutscheStimme  = null;
let aktuelleAussage = null; // verhindert Garbage-Collection der Utterance

function stimmenLaden() {
    const stimmen = synth.getVoices();
    deutscheStimme =
        stimmen.find(v => v.name === 'Anna') ||
        stimmen.find(v => /Steffi|Markus|Yannick/i.test(v.name) && v.lang.startsWith('de')) ||
        stimmen.find(v => v.name.startsWith('Google') && v.lang === 'de-DE') ||
        stimmen.find(v => !v.localService && v.lang === 'de-DE') ||
        stimmen.find(v => v.localService && v.lang === 'de-DE') ||
        stimmen.find(v => v.lang.startsWith('de')) ||
        null;
}
stimmenLaden();
if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = stimmenLaden;

function sprechEinheit(text, tempo, tonhöhe) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'de-DE';
    u.rate  = tempo;
    u.pitch = tonhöhe;
    u.volume = 1;
    if (deutscheStimme) u.voice = deutscheStimme;
    return u;
}

// Natürliche Stimme: vorab erzeugte MP3-Clips (Katja), Web Speech nur als Fallback.
// EIN wiederverwendetes Audio-Element — iOS entsperrt es bei der ersten Geste.
const sprachClip = new Audio();
sprachClip.preload = 'auto';

function audioSchluessel(text) {
    return text.toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9 ]/g, '').trim().replace(/ +/g, '_');
}

function sprechenFallback(text, tempo, tonhöhe) {
    aktuelleAussage = sprechEinheit(text, tempo, tonhöhe);
    synth.speak(aktuelleAussage);
}

function sprechen(text, tempo = 0.82, tonhöhe = 1.25) {
    synth.cancel();
    let fallbackAktiv = false; // verhindert doppelten Fallback (onerror + play-reject)
    const fallback = () => { if (!fallbackAktiv) { fallbackAktiv = true; sprechenFallback(text, tempo, tonhöhe); } };
    sprachClip.onerror = fallback;
    sprachClip.src = 'audio/' + audioSchluessel(text) + '.mp3';
    sprachClip.play().catch(fallback);
}

function buchstabeAnsagen(z) {
    sprechen('Finde ' + z.toLowerCase(), 0.78, 1.25);
}

function superSprechen() {
    sprechen('Super!', 0.9, 1.5);
}

// ── Hintergrundmusik: sehr dezente Spieluhr ────────────────────────────────
// Einzelne, leise Glöckchen-Töne mit vielen Pausen (C-Dur-Pentatonik).
// [Hz, Schläge] — Hz 0 = Pause.
const SPIELUHR_NOTEN = [
    [523.25,2],[659.25,2],[783.99,3],[0,1],
    [880.00,2],[783.99,2],[659.25,3],[0,3],
    [587.33,2],[659.25,2],[523.25,3],[0,1],
    [440.00,2],[523.25,2],[392.00,3],[0,3],
];
const BPM   = 54;
const SCHLAG = 60 / BPM;

let audioCtx     = null;
let masterGain   = null;
let melIdx = 0;
let melZeit = 0;

function musikStarten() {
    if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
    }
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();

    const komp = audioCtx.createDynamicsCompressor();
    komp.threshold.value = -18;
    komp.ratio.value     = 4;
    komp.attack.value    = 0.05;
    komp.release.value   = 0.3;

    masterGain.connect(komp);
    komp.connect(audioCtx.destination);
    masterGain.gain.setValueAtTime(0.07, audioCtx.currentTime);

    melZeit = audioCtx.currentTime + 0.15;
    musikSchedulieren();
}

function bellen() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [[0, 0.14], [0.22, 0.11]].forEach(([delay, dur]) => {
        const osc  = audioCtx.createOscillator();
        const filt = audioCtx.createBiquadFilter();
        const env  = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(310, t + delay);
        osc.frequency.exponentialRampToValueAtTime(110, t + delay + dur);
        filt.type = 'bandpass';
        filt.frequency.setValueAtTime(1700, t + delay);
        filt.frequency.exponentialRampToValueAtTime(480, t + delay + dur);
        filt.Q.value = 2.8;
        env.gain.setValueAtTime(0, t + delay);
        env.gain.linearRampToValueAtTime(0.6, t + delay + 0.010);
        env.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
        osc.connect(filt); filt.connect(env); env.connect(audioCtx.destination);
        osc.start(t + delay); osc.stop(t + delay + dur + 0.02);

        const osc2 = audioCtx.createOscillator();
        const env2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(190, t + delay);
        osc2.frequency.exponentialRampToValueAtTime(75, t + delay + dur * 0.75);
        env2.gain.setValueAtTime(0, t + delay);
        env2.gain.linearRampToValueAtTime(0.45, t + delay + 0.008);
        env2.gain.exponentialRampToValueAtTime(0.001, t + delay + dur * 0.85);
        osc2.connect(env2); env2.connect(audioCtx.destination);
        osc2.start(t + delay); osc2.stop(t + delay + dur + 0.02);
    });
}

// Heller "Plopp" beim Zerplatzen einer Blase
function ploppen() {
    if (!audioCtx) return;
    const t   = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(880, t + 0.07);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.4, t + 0.008);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(env); env.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.14);
}

// Glöckchen-Ton wie aus einer Spieluhr: schneller Anschlag, langes Ausklingen
function spieluhrNote(hz, start) {
    const dauer = 2.2;
    [[hz, 0.10], [hz * 3, 0.018]].forEach(([f, v]) => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, start);
        env.gain.setValueAtTime(0, start);
        env.gain.linearRampToValueAtTime(v, start + 0.008);
        env.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
        osc.connect(env); env.connect(masterGain);
        osc.start(start);
        osc.stop(start + dauer + 0.05);
    });
}

function musikSchedulieren() {
    if (!audioCtx) return;
    const bis = audioCtx.currentTime + 0.6;

    while (melZeit < bis) {
        const [hz, s] = SPIELUHR_NOTEN[melIdx];
        if (hz) spieluhrNote(hz, melZeit);
        melZeit += s * SCHLAG;
        melIdx   = (melIdx + 1) % SPIELUHR_NOTEN.length;
    }
    setTimeout(musikSchedulieren, 250);
}

// ── Spielzustand ───────────────────────────────────────────────────────────
let zustand, punkte, ziel, blasen, partikel, spieler, aktiverLevel;
let flashTimer     = 0;
let letzterTreffer = '';
let spawnTimer     = 30;
let zielPending    = false;   // true = es muss (wieder) ein Ziel aus den Blasen gewählt werden

function mischen(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

let buchstabenSchlange = [];
function schlangeNeuFuellen() { buchstabenSchlange = mischen([...ALPHABET]); }
function naechsterBuchstabe() {
    if (!buchstabenSchlange.length) schlangeNeuFuellen();
    return buchstabenSchlange.pop();
}

let zahlenSchlange = [];
function zahlenNeuFuellen() { zahlenSchlange = mischen([...ZAHLEN]); }
function naechsteZahl() {
    if (!zahlenSchlange.length) zahlenNeuFuellen();
    return zahlenSchlange.pop();
}
function naechstesZiel() {
    return aktiverLevel === 1 ? naechsterBuchstabe() : naechsteZahl();
}

function zielSetzen(t) {
    ziel = t;
    const leuchtet = punkte < GLOW_UNTIL;
    for (const b of blasen) {
        if (!b.weg) {
            b.istZiel  = b.zeichen === ziel;
            b.leuchtet = leuchtet && b.istZiel;
        }
    }
}

// Ziel zurücksetzen – ein neues wird beim nächsten Frame aus den Blasen gewählt
function zielLeeren() {
    ziel = null;
    zielPending = true;
    for (const b of blasen) { b.istZiel = false; b.leuchtet = false; }
}

// Wähle ZUFÄLLIG eine der bereits sichtbaren Blasen als Ziel (nicht die neueste!)
// und sage sie an. Wartet, bis genug Auswahl da ist, damit es nicht zu leicht wird.
function zielAusBlasen() {
    const wahl = blasen.filter(b => !b.weg && b.y < H - BLASE_R * 0.5);
    if (wahl.length < 2) return false;
    const b = wahl[Math.floor(Math.random() * wahl.length)];
    zielSetzen(b.zeichen);
    buchstabeAnsagen(b.zeichen);
    zielPending = false;
    return true;
}

function spielerErstellen() {
    return { x: W / 2, y: GROUND, vy: 0, aufBoden: true,
             richtung: 1, beinPhase: 0, blinzelTimer: 0 };
}

// Ein paar Blasen sofort ins Bild setzen, damit gleich eine Auswahl da ist
function startBlasenSetzen(anzahl) {
    for (let i = 0; i < anzahl; i++) {
        const z = naechstesFreiesZeichen();
        if (z == null) break;
        blaseErzeugen(z, Math.min(200 + i * 110 + Math.random() * 40, GROUND - 30));
    }
}

// Erstes Ziel synchron aus den Startblasen wählen + ansagen
// (VOR musikStarten – Safari blockiert speak()/Audio erst nach AudioContext)
function erstesZielWaehlen() {
    const wahl = blasen.filter(b => !b.weg);
    const b = wahl[Math.floor(Math.random() * wahl.length)];
    zielSetzen(b.zeichen);
    buchstabeAnsagen(b.zeichen);
    zielPending = false;
}

function spielStart() {
    aktiverLevel = 1;
    punkte       = 0;
    blasen       = [];
    partikel     = [];
    spieler      = spielerErstellen();
    flashTimer   = 0;
    spawnTimer   = 30;
    zielPending  = false;
    schlangeNeuFuellen();
    startBlasenSetzen(3);
    erstesZielWaehlen();
    zustand = 'spielen';
    musikStarten();
}

function level2Starten() {
    aktiverLevel = 2;
    punkte       = 0;
    blasen       = [];
    partikel     = [];
    spieler      = spielerErstellen();
    flashTimer   = 0;
    spawnTimer   = 30;
    zielPending  = false;
    zahlenNeuFuellen();
    startBlasenSetzen(3);
    erstesZielWaehlen();
    zustand = 'spielen';
}

// ── Blasen-Spawn: schweben langsam von unten nach oben ─────────────────────
function blaseErzeugen(zeichen, y) {
    const menge     = aktiverLevel === 1 ? ALPHABET : ZAHLEN;
    const farbArray = aktiverLevel === 1 ? FARBEN : ZAHLEN_FARBEN;
    blasen.push({
        zeichen,
        x0       : BLASE_R + 20 + Math.random() * (W - BLASE_R * 2 - 40),
        x        : 0,
        y,
        vy       : 0.45 + Math.random() * 0.25 + punkte * 0.012,
        schwingT : Math.random() * Math.PI * 2,
        schwingA : 14 + Math.random() * 18,
        istZiel  : zeichen === ziel,
        farbe    : farbArray[menge.indexOf(zeichen) % farbArray.length],
        leuchtet : punkte < GLOW_UNTIL && zeichen === ziel,
        glowT    : 0,
        wackelT  : 0,
        weg      : false
    });
}

// Nächstes Zeichen aus der gemischten Schlange, das nicht schon im Bild ist
// (keine Doubletten – so bleibt das Ziel eindeutig).
function naechstesFreiesZeichen() {
    const aufSchirm = new Set(blasen.filter(b => !b.weg).map(b => b.zeichen));
    const menge = aktiverLevel === 1 ? ALPHABET : ZAHLEN;
    for (let i = 0; i < menge.length; i++) {
        const z = naechstesZiel();   // zieht aus der gemischten Schlange (volle Abdeckung)
        if (!aufSchirm.has(z)) return z;
    }
    return null;
}

function blasenSpawnen() {
    spawnTimer--;
    if (spawnTimer > 0) return;
    spawnTimer = 55 + Math.floor(Math.random() * 35);

    const maxBlasen = punkte < 5 ? 3 : punkte < 10 ? 4 : 5;
    if (blasen.filter(b => !b.weg).length >= maxBlasen) return;

    const z = naechstesFreiesZeichen();
    if (z == null) return;
    blaseErzeugen(z, H + BLASE_R);
}

function blasenBewegen() {
    for (const b of blasen) {
        if (b.weg) continue;
        b.y        -= b.vy;
        b.schwingT += 0.018;
        b.glowT    += 0.06;
        if (b.wackelT > 0) b.wackelT--;
        b.x = b.x0 + Math.sin(b.schwingT) * b.schwingA;
        if (b.y < -BLASE_R) b.weg = true;
    }
    blasen = blasen.filter(b => !b.weg);
}

// ── Partikel: modernes Konfetti (Kreise + rotierende Streifen) ─────────────
const KONFETTI_FARBEN = ['#FF6B9D','#FFD34D','#5AC8FA','#7ED957','#B388FF','#FF9E5E'];
function explosion(x, y, farbe, n = 18) {
    for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i / n) + Math.random() * 0.5;
        const s = 3 + Math.random() * 5;
        partikel.push({
            x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
            farbe: Math.random() < 0.5 ? farbe : KONFETTI_FARBEN[i % KONFETTI_FARBEN.length],
            r: 4 + Math.random() * 6,
            form: Math.random() < 0.45 ? 'streifen' : 'kreis',
            rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 0.3,
            leben: 1, abbau: 0.018 + Math.random() * 0.015
        });
    }
}

function partikelUpdate() {
    for (const p of partikel) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.leben -= p.abbau;
        p.rot += p.vrot;
    }
    partikel = partikel.filter(p => p.leben > 0);
}

// ── Update ─────────────────────────────────────────────────────────────────
function update() {
    if (zustand !== 'spielen') return;

    if (flashTimer > 0) {
        flashTimer--;
        if (flashTimer === 0) zielPending = true;   // nach dem Jubel ein neues Ziel wählen
    }

    blasenSpawnen();
    blasenBewegen();
    partikelUpdate();

    // Ziel weggeschwebt, ohne getippt zu werden? → neues Ziel aus den Blasen
    if (!zielPending && flashTimer === 0 && !blasen.some(b => !b.weg && b.zeichen === ziel)) {
        zielLeeren();
    }
    // Neues Ziel zufällig aus den vorhandenen Blasen wählen, sobald genug da sind
    if (zielPending && flashTimer === 0) {
        zielAusBlasen();
    }

    // Marshall: freudiger Hüpfer nach Treffer, sonst stehen und wedeln
    spieler.vy += 0.65;
    spieler.y  += spieler.vy;
    if (spieler.y >= GROUND) { spieler.y = GROUND; spieler.vy = 0; spieler.aufBoden = true; }
    spieler.beinPhase   += 0.07;
    spieler.blinzelTimer = (spieler.blinzelTimer + 1) % 180;
}

// ── Klick / Tipp ───────────────────────────────────────────────────────────
function spielfeldKoordinaten(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * W / rect.width,
        y: (e.clientY - rect.top)  * H / rect.height
    };
}

function blaseAngeklickt(x, y) {
    // Oberste (zuletzt gezeichnete) Blase zuerst prüfen, großzügiger Radius
    for (let i = blasen.length - 1; i >= 0; i--) {
        const b = blasen[i];
        if (b.weg) continue;
        const dx = x - b.x, dy = y - b.y;
        if (dx * dx + dy * dy <= (BLASE_R + 12) * (BLASE_R + 12)) return b;
    }
    return null;
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (zustand === 'start' || zustand === 'gewonnen') { spielStart();   return; }
    if (zustand === 'levelzwischen')                   { level2Starten(); return; }
    if (zustand !== 'spielen') return;
    if (!ziel) return;   // Ziel wird gerade neu gewählt – Tipps kurz ignorieren

    const { x, y } = spielfeldKoordinaten(e);
    const b = blaseAngeklickt(x, y);
    if (!b) return;

    if (b.istZiel) {
        b.weg = true;
        letzterTreffer = ziel;
        punkte++;
        explosion(b.x, b.y, b.farbe, 24);
        ploppen();
        bellen();
        spieler.vy = -11;          // Freuden-Hüpfer
        spieler.aufBoden = false;
        spieler.richtung = b.x >= spieler.x ? 1 : -1;
        if (punkte >= ZIEL_PRO_LEVEL) {
            if (aktiverLevel === 1) {
                zustand = 'levelzwischen';
                sprechen('Super! Buchstaben geschafft! Jetzt kommen Zahlen!', 0.88, 1.5);
            } else {
                zustand = 'gewonnen';
                sprechen('Wahnsinn! Du hast alle Zahlen gefunden!', 0.9, 1.6);
            }
            return;
        }
        superSprechen();
        zielLeeren();        // neues Ziel wird nach dem Jubel aus den Blasen gewählt
        flashTimer = 75;
    } else {
        // Kein Leben verlieren – Blase wackelt nur freundlich
        b.wackelT = 36;
        sprechen(`Hoppla! Such ${ziel.toLowerCase()}!`, 0.82, 1.15);
    }
});

// ── Zeichnen-Hilfsfunktionen ───────────────────────────────────────────────
function rundesRechteck(x, y, b, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + b - r, y);
    ctx.quadraticCurveTo(x + b, y, x + b, y + r);
    ctx.lineTo(x + b, y + h - r);
    ctx.quadraticCurveTo(x + b, y + h, x + b - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ── Hintergrund: weiche Pastell-Landschaft ─────────────────────────────────
const WOLKEN = [
    { x:  90, y:  75, g: 1.0,  a: 0.85, v: 0.10 },
    { x: 320, y:  45, g: 0.7,  a: 0.75, v: 0.06 },
    { x: 580, y:  95, g: 0.85, a: 0.70, v: 0.08 },
    { x: 730, y:  40, g: 0.55, a: 0.65, v: 0.05 },
];

function huegel(cx, cy, rx, ry, farbe) {
    ctx.fillStyle = farbe;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0);
    ctx.fill();
}

function hintergrundZeichnen() {
    // Himmel
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (aktiverLevel === 2) {           // sanfter Pastell-Sonnenuntergang
        grad.addColorStop(0,   '#9d8fe0');
        grad.addColorStop(0.5, '#f5a8c5');
        grad.addColorStop(1,   '#ffd9a3');
    } else {                            // weicher Tag
        grad.addColorStop(0,   '#7cc6f2');
        grad.addColorStop(0.6, '#b4e0f9');
        grad.addColorStop(1,   '#e6f6ff');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Sonne mit weichem Halo
    const sx = aktiverLevel === 2 ? W - 140 : 120;
    const sy = aktiverLevel === 2 ? GROUND - 90 : 95;
    const sFarbe = aktiverLevel === 2 ? '255,170,120' : '255,228,130';
    const halo = ctx.createRadialGradient(sx, sy, 10, sx, sy, 150);
    halo.addColorStop(0, `rgba(${sFarbe},0.85)`);
    halo.addColorStop(0.35, `rgba(${sFarbe},0.30)`);
    halo.addColorStop(1, `rgba(${sFarbe},0)`);
    ctx.fillStyle = halo;
    ctx.fillRect(sx - 150, sy - 150, 300, 300);
    ctx.fillStyle = aktiverLevel === 2 ? '#ffb27a' : '#ffe98a';
    ctx.beginPath();
    ctx.arc(sx, sy, 38, 0, Math.PI * 2);
    ctx.fill();

    // Wolken driften langsam
    const wolkenAlpha = aktiverLevel === 2 ? 0.5 : 1;
    for (const w of WOLKEN) {
        w.x += w.v;
        if (w.x > W + 130) w.x = -130;
        wolkeZeichnen(w.x, w.y, w.g, w.a * wolkenAlpha);
    }

    // Weiche Hügel statt flacher Wiese
    if (aktiverLevel === 2) {
        huegel(W * 0.22, GROUND + 14, 330, 95, '#7cb86e');
        huegel(W * 0.78, GROUND + 14, 360, 75, '#8fc97f');
    } else {
        huegel(W * 0.22, GROUND + 14, 330, 95, '#8fd483');
        huegel(W * 0.78, GROUND + 14, 360, 75, '#a5dd96');
    }
    const bg = ctx.createLinearGradient(0, GROUND, 0, H);
    if (aktiverLevel === 2) {
        bg.addColorStop(0, '#6fae62');
        bg.addColorStop(1, '#4d8a45');
    } else {
        bg.addColorStop(0, '#7fcb72');
        bg.addColorStop(1, '#5aac52');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, GROUND + 8, W, H - GROUND - 8);
}

function wolkeZeichnen(x, y, groesse, deckkraft) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(groesse, groesse);
    ctx.fillStyle = `rgba(255,255,255,${deckkraft})`;
    for (const [cx, cy, r] of [
        [0,0,34],[30,-8,25],[-30,-5,23],[54,4,19],[-52,4,17],[18,-20,19],[-14,-18,17]
    ]) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// ── Marshall von PAW Patrol (Dalmatiner, Feuerwehr) ───────────────────────
const M = {
    fell      : '#FFFFFF',
    fleck     : '#1C1C1C',
    uniform   : '#D32F2F',
    helmRot   : '#C62828',
    helmDunkel: '#7B0000',
    auge      : '#6D4C41',
    augeInnen : '#1A0800',
    nase      : '#1A1A1A',
    mund      : '#D47070',
    gold      : '#FFD700',
};

function spielerZeichnen() {
    const s       = spieler;
    const blinzel = s.blinzelTimer > 170;

    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.richtung === -1) ctx.scale(-1, 1);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 3, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    marshallSchwanz(s.beinPhase);

    // Hinterbein
    ctx.save();
    ctx.translate(-10, -12);
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(0, -6, 6, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(2, -2, 3, 2, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(2, 8, 8, 5, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    marshallKoerper();

    // Vorderarm (roter Ärmel)
    ctx.save();
    ctx.translate(14, -42);
    ctx.rotate(0.3);
    ctx.fillStyle = M.uniform;
    ctx.beginPath(); ctx.ellipse(0, -3, 6, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(-1, 9, 7, 5, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    marshallOhren(s.beinPhase);
    marshallKopf(blinzel);

    ctx.restore();
}

function marshallSchwanz(phase) {
    const w = Math.sin(phase * 1.8) * 9;
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(-14, -38);
    ctx.quadraticCurveTo(-26 + w * 0.5, -54, -20 + w, -68);
    ctx.quadraticCurveTo(-15 + w, -66, -12 + w * 0.4, -54);
    ctx.quadraticCurveTo(-15 + w * 0.2, -42, -14, -38);
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-18 + w * 0.4, -56, 4, 2.5, 0.4, 0, Math.PI * 2); ctx.fill();
}

function marshallKoerper() {
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.ellipse(0, -34, 18, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = M.uniform;
    ctx.beginPath();
    ctx.ellipse(0, -40, 14, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.ellipse(0, -29, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    knochenAbzeichen(0, -46, 6);

    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-11, -46, 5, 3.5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 10, -29, 4, 3,    0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( -6, -22, 3.5, 2.5, 0.2, 0, Math.PI * 2); ctx.fill();
}

function knochenAbzeichen(x, y, s) {
    ctx.fillStyle = M.gold;
    rundesRechteck(x - s, y - s * 0.22, s * 2, s * 0.44, s * 0.2);
    ctx.fill();
    for (const [dx, dy] of [[-s, -s*0.32], [-s, s*0.32], [s, -s*0.32], [s, s*0.32]]) {
        ctx.beginPath(); ctx.arc(x + dx, y + dy, s * 0.38, 0, Math.PI * 2); ctx.fill();
    }
}

function marshallOhren(phase) {
    const sw = Math.sin(phase * 0.8) * 2;

    ctx.save();
    ctx.translate(-23, -70);
    ctx.rotate(-0.12 + sw * 0.012);
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.bezierCurveTo(-2, 6, -13, 18, -11, 34);
    ctx.bezierCurveTo(-9, 44, 2, 47, 7, 43);
    ctx.bezierCurveTo(12, 38, 12, 24, 9, 10);
    ctx.bezierCurveTo(8, 4, 7, 1, 5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-1, 26, 4, 7, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(23, -70);
    ctx.rotate(0.12 - sw * 0.012);
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.bezierCurveTo(2, 6, 13, 18, 11, 34);
    ctx.bezierCurveTo(9, 44, -2, 47, -7, 43);
    ctx.bezierCurveTo(-12, 38, -12, 24, -9, 10);
    ctx.bezierCurveTo(-8, 4, -7, 1, -5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(1, 24, 4, 7, 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function marshallKopf(blinzel) {
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.arc(0, -66, 27, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse( 13, -76, 7, 5,   0.5,  0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-15, -62, 5, 3.5,-0.3,  0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(  9, -54, 4, 3,   0.4,  0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#FFFAFA';
    ctx.beginPath();
    ctx.ellipse(0, -58, 20, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Feuerwehrhelm
    ctx.fillStyle = M.helmRot;
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.closePath();
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(-30, -74, 60, 8);
    ctx.restore();

    ctx.strokeStyle = M.helmDunkel;
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.stroke();

    ctx.fillStyle = M.helmDunkel;
    ctx.beginPath();
    ctx.ellipse(6, -54, 30, 6.5, -0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = M.helmRot;
    ctx.beginPath();
    ctx.ellipse(5, -55.5, 28, 5, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle    = M.gold;
    ctx.font         = 'bold 13px Arial';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('03', 1, -81);

    // Augen
    if (blinzel) {
        ctx.strokeStyle = M.augeInnen;
        ctx.lineWidth   = 3;
        ctx.lineCap     = 'round';
        ctx.beginPath(); ctx.moveTo(-16, -60); ctx.lineTo(-7, -60); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(  7, -60); ctx.lineTo(16, -60); ctx.stroke();
    } else {
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(-11, -60, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.auge;
        ctx.beginPath(); ctx.ellipse(-11, -60, 6,   7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.augeInnen;
        ctx.beginPath(); ctx.arc(-11, -60, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(-8.5, -64, 2.8, 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-14, -61.5, 1.2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(11, -60, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.auge;
        ctx.beginPath(); ctx.ellipse(11, -60, 6,   7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.augeInnen;
        ctx.beginPath(); ctx.arc(11, -60, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(13.5, -64, 2.8, 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -61.5, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // Schnauze
    ctx.fillStyle = '#FFF0F0';
    ctx.beginPath();
    ctx.ellipse(0, -47, 13, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = M.nase;
    ctx.beginPath();
    ctx.ellipse(0, -54, 6, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(-2, -56, 2, 1.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = M.nase;
    ctx.lineWidth   = 1.8;
    ctx.lineCap     = 'round';
    ctx.beginPath(); ctx.moveTo(0, -49); ctx.lineTo(0, -44); ctx.stroke();

    ctx.strokeStyle = M.mund;
    ctx.lineWidth   = 2.2;
    ctx.beginPath();
    ctx.moveTo(-9, -44);
    ctx.quadraticCurveTo(0, -38, 9, -44);
    ctx.stroke();
}

// ── Blasen zeichnen ────────────────────────────────────────────────────────
function blasenZeichnen() {
    for (const b of blasen) {
        if (b.weg) continue;
        ctx.save();

        // Wackeln nach Fehlklick
        const wx = b.wackelT > 0 ? Math.sin(b.wackelT * 0.9) * 5 : 0;
        ctx.translate(b.x + wx, b.y);

        // Moderner Flat-Look: satte Farbe, weicher Schatten, klare Schrift
        if (b.leuchtet) {
            ctx.shadowColor   = '#FFD700';
            ctx.shadowBlur    = 30 + Math.sin(b.glowT) * 16;
            ctx.shadowOffsetY = 0;
        } else {
            ctx.shadowColor   = 'rgba(30, 60, 95, 0.20)';
            ctx.shadowBlur    = 16;
            ctx.shadowOffsetY = 7;
        }
        ctx.fillStyle = b.farbe;
        ctx.beginPath();
        ctx.arc(0, 0, BLASE_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        if (b.leuchtet) {
            ctx.strokeStyle = `rgba(255,220,0,${0.7 + Math.sin(b.glowT) * 0.3})`;
            ctx.lineWidth   = 6;
        } else {
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth   = 4;
        }
        ctx.stroke();

        ctx.fillStyle    = 'white';
        ctx.font         = (b.zeichen.length > 1 ? 'bold 38px ' : 'bold 54px ') + SCHRIFT;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.zeichen, 0, 3);
        ctx.restore();
    }
}

// ── HUD: helle Glas-Pills mit dunkler Schrift ──────────────────────────────
function glasPill(x, y, b, h, r) {
    ctx.shadowColor   = 'rgba(30, 60, 95, 0.16)';
    ctx.shadowBlur    = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    rundesRechteck(x, y, b, h, r);
    ctx.fill();
    ctx.shadowBlur    = 0;
    ctx.shadowOffsetY = 0;
}

function anzeigeZeichnen() {
    // Zielbox – nur in den ersten drei Runden
    if (punkte < 3) {
        glasPill(W / 2 - 150, 12, 300, 70, 24);
        ctx.fillStyle    = '#7a8aa0';
        ctx.font         = 'bold 16px ' + SCHRIFT;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(aktiverLevel === 1 ? 'Finde den Buchstaben' : 'Finde die Zahl', W / 2, 36);
        ctx.fillStyle = '#ff5da2';
        ctx.font      = 'bold 36px ' + SCHRIFT;
        ctx.fillText(ziel, W / 2, 72);
    }

    // Knochen-Fortschritt (Zähler + Level-Label in einer Pill)
    glasPill(W - 176, 12, 164, 64, 24);
    ctx.fillStyle    = '#33506e';
    ctx.font         = 'bold 21px ' + SCHRIFT;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(`🦴 ${punkte} / ${ZIEL_PRO_LEVEL}`, W - 94, 41);
    ctx.fillStyle = '#7a8aa0';
    ctx.font      = 'bold 13px ' + SCHRIFT;
    ctx.fillText(aktiverLevel === 1 ? 'Level 1 · Buchstaben' : 'Level 2 · Zahlen', W - 94, 64);

    // Leuchthinweis — oben, unter der Zielbox
    if (punkte < GLOW_UNTIL) {
        const hinweis = aktiverLevel === 1
            ? '✨ Die richtige Blase leuchtet golden – tippe sie an!'
            : '✨ Die richtige Zahl leuchtet golden – tippe sie an!';
        ctx.font = 'bold 15px ' + SCHRIFT;
        const tb = ctx.measureText(hinweis).width + 40;
        const hy = punkte < 3 ? 92 : 16;
        glasPill(W / 2 - tb / 2, hy, tb, 36, 18);
        ctx.fillStyle    = '#c98a00';
        ctx.textAlign    = 'center';
        ctx.fillText(hinweis, W / 2, hy + 24);
    }
}

// ── Flash-Overlay (nur bei Erfolg, kein rotes Schimpfen) ───────────────────
function flashZeichnen() {
    if (flashTimer <= 0) return;
    const alpha = Math.min(1, flashTimer / 25) * 0.22;
    ctx.fillStyle = `rgba(120,210,140,${alpha})`;
    ctx.fillRect(0, 0, W, H);
    if (flashTimer > 45) {
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor   = 'rgba(30,60,95,0.35)';
        ctx.shadowBlur    = 18;
        ctx.shadowOffsetY = 5;
        ctx.font         = 'bold 68px ' + SCHRIFT;
        ctx.fillStyle    = 'white';
        ctx.fillText(`🦴 SUPER! 🦴`, W / 2, H / 2 - 18);
        ctx.font         = 'bold 54px ' + SCHRIFT;
        ctx.fillStyle    = '#ffd34d';
        ctx.fillText(letzterTreffer, W / 2, H / 2 + 46);
        ctx.shadowBlur    = 0;
        ctx.shadowOffsetY = 0;
    }
}

// ── Partikel ───────────────────────────────────────────────────────────────
function partikelZeichnen() {
    for (const p of partikel) {
        ctx.save();
        ctx.globalAlpha = p.leben;
        ctx.fillStyle   = p.farbe;
        if (p.form === 'streifen') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            rundesRechteck(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8, p.r * 0.3);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

// ── Bildschirme: weiche Karte auf der Landschaft statt dunklem Overlay ─────
function karteZeichnen(x, y, b, h) {
    ctx.shadowColor   = 'rgba(30, 60, 95, 0.25)';
    ctx.shadowBlur    = 36;
    ctx.shadowOffsetY = 14;
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    rundesRechteck(x, y, b, h, 32);
    ctx.fill();
    ctx.shadowBlur    = 0;
    ctx.shadowOffsetY = 0;
}

function knopfZeichnen(text, y, breite = 280) {
    const x = W / 2 - breite / 2;
    ctx.shadowColor   = 'rgba(233, 30, 140, 0.45)';
    ctx.shadowBlur    = 20;
    ctx.shadowOffsetY = 8;
    const kg = ctx.createLinearGradient(0, y, 0, y + 64);
    kg.addColorStop(0, '#ff7ab8');
    kg.addColorStop(1, '#f0408f');
    ctx.fillStyle = kg;
    rundesRechteck(x, y, breite, 64, 32);
    ctx.fill();
    ctx.shadowBlur    = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle    = 'white';
    ctx.font         = 'bold 28px ' + SCHRIFT;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2, y + 33);
    ctx.textBaseline = 'alphabetic';
}

function startbildschirmZeichnen() {
    hintergrundZeichnen();
    karteZeichnen(W / 2 - 290, 88, 580, 424);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font         = '54px ' + SCHRIFT;
    ctx.fillText('🫧', W / 2, 162);
    ctx.fillStyle    = '#ff5da2';
    ctx.font         = 'bold 46px ' + SCHRIFT;
    ctx.fillText('Buchstaben-Blasen!', W / 2, 222);
    ctx.fillStyle    = '#33506e';
    ctx.font         = '21px ' + SCHRIFT;
    ctx.fillText('Tippe auf die Blase mit dem richtigen Buchstaben.', W / 2, 272);
    ctx.fillText('Du kannst nichts falsch machen – probier es einfach!', W / 2, 304);
    ctx.fillStyle    = '#7a8aa0';
    ctx.font         = '18px ' + SCHRIFT;
    ctx.fillText('🖱️ Klicken oder 👆 Tippen – mehr brauchst du nicht', W / 2, 352);
    knopfZeichnen('START!', 398, 260);
}

function levelZwischenZeichnen() {
    hintergrundZeichnen();
    karteZeichnen(W / 2 - 300, 80, 600, 440);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font         = '54px ' + SCHRIFT;
    ctx.fillText('🎉', W / 2, 158);
    ctx.fillStyle    = '#ff5da2';
    ctx.font         = 'bold 44px ' + SCHRIFT;
    ctx.fillText('Buchstaben geschafft!', W / 2, 216);
    ctx.fillStyle    = '#33506e';
    ctx.font         = '22px ' + SCHRIFT;
    ctx.fillText('Super gemacht! Jetzt kommen', W / 2, 266);
    ctx.fillStyle    = '#f59a23';
    ctx.font         = 'bold 40px ' + SCHRIFT;
    ctx.fillText('Zahlen von 0 bis 20!', W / 2, 320);
    ctx.fillStyle    = '#7a8aa0';
    ctx.font         = '19px ' + SCHRIFT;
    ctx.fillText('Tippe wieder auf die richtige Blase!', W / 2, 362);
    knopfZeichnen('Level 2 starten! 🔢', 404, 300);
}

function gewonnenZeichnen() {
    hintergrundZeichnen();
    karteZeichnen(W / 2 - 300, 74, 600, 452);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font         = '54px ' + SCHRIFT;
    ctx.fillText('🏆', W / 2, 152);
    ctx.fillStyle    = '#ff5da2';
    ctx.font         = 'bold 44px ' + SCHRIFT;
    ctx.fillText('Alle Zahlen gefunden!', W / 2, 210);
    ctx.fillStyle    = '#33506e';
    ctx.font         = '22px ' + SCHRIFT;
    ctx.fillText('Wahnsinn! Du bist ein Zahlen-Profi!', W / 2, 260);
    ctx.fillStyle    = '#f59a23';
    ctx.font         = 'bold 22px ' + SCHRIFT;
    ctx.fillText('Buchstaben UND Zahlen gemeistert! 🐾', W / 2, 298);
    ctx.font = '46px ' + SCHRIFT;
    ctx.fillText('🦴🦴🦴', W / 2, 366);
    knopfZeichnen('Nochmal spielen!', 410, 280);
}

// ── Hauptschleife ──────────────────────────────────────────────────────────
zustand      = 'start';
aktiverLevel = 1;
blasen       = [];
partikel     = [];
spieler      = spielerErstellen();
punkte       = 0;

function zeichnen() {
    ctx.clearRect(0, 0, W, H);
    if (zustand === 'start')         { startbildschirmZeichnen(); return; }
    if (zustand === 'gewonnen')      { gewonnenZeichnen();        return; }
    if (zustand === 'levelzwischen') { levelZwischenZeichnen();   return; }
    hintergrundZeichnen();
    blasenZeichnen();
    spielerZeichnen();
    partikelZeichnen();
    anzeigeZeichnen();
    flashZeichnen();
}

function schleife() { update(); zeichnen(); requestAnimationFrame(schleife); }
schleife();
</script>
