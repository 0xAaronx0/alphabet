<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buchstaben Fang!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(0, 100, 200, 0.3);
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;

function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.97;
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ── Konstanten ─────────────────────────────────────────────────────────────
const GROUND     = H - 90;
const PW         = 44;
const PH         = 72;
const LETTER_R   = 36;
const GRAVITY    = 0.65;
const JUMP_V     = -15;
const GLOW_UNTIL = 6;

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ZAHLEN   = Array.from({length: 21}, (_, i) => String(i)); // 0–20
const FARBEN   = [
    '#FF6B6B','#4ECDC4','#45B7D1','#FFA94D','#A9E34B',
    '#DDA0DD','#FFD43B','#74C0FC','#F783AC','#63E6BE',
    '#FF8787','#66D9E8','#A9C4EB','#FFEC99','#B2F2BB',
    '#FAB005','#E599F7','#74C0FC','#FFA8A8','#8CE99A',
    '#FF922B','#748FFC','#3BC9DB','#F06595','#69DB7C',
    '#DA77F2'
];
const ZAHLEN_FARBEN = FARBEN.slice(0, 21);

// ── Sprache: ausschließlich Deutsch ───────────────────────────────────────
const synth = window.speechSynthesis;
let deutscheStimme  = null;
let aktuelleAussage = null; // verhindert Garbage-Collection der Utterance

function stimmenLaden() {
    const stimmen = synth.getVoices();
    // Priorität: beste natürlichste deutsche Stimme
    deutscheStimme =
        // macOS: "Anna" – hochwertige lokale Stimme
        stimmen.find(v => v.name === 'Anna') ||
        // macOS Ventura+: Samantha (DE) / Steffi / Markus
        stimmen.find(v => /Steffi|Markus|Yannick/i.test(v.name) && v.lang.startsWith('de')) ||
        // Chrome: Google-Onlinestimme (höchste Qualität)
        stimmen.find(v => v.name.startsWith('Google') && v.lang === 'de-DE') ||
        // Sonstige Online-Stimmen (besser als Standard-Local)
        stimmen.find(v => !v.localService && v.lang === 'de-DE') ||
        // Lokale de-DE Fallback
        stimmen.find(v => v.localService && v.lang === 'de-DE') ||
        stimmen.find(v => v.lang.startsWith('de')) ||
        null;
}
stimmenLaden();
if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = stimmenLaden;

function sprechEinheit(text, tempo, tonhöhe) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'de-DE';
    u.rate  = tempo;
    u.pitch = tonhöhe;
    u.volume = 1;
    if (deutscheStimme) u.voice = deutscheStimme;
    return u;
}

function sprechen(text, tempo = 0.82, tonhöhe = 1.25) {
    synth.cancel();
    aktuelleAussage = sprechEinheit(text, tempo, tonhöhe);
    setTimeout(() => synth.speak(aktuelleAussage), 80);
}

// Buchstaben-Ansage: Einleitung normal, dann Buchstabe betont & langsamer
function buchstabeAnsagen(buchstabe) {
    sprechen('Finde ' + buchstabe.toLowerCase(), 0.78, 1.25);
}

function superSprechen() {
    sprechen('Super!', 0.9, 1.5);
}

// ── Hintergrundmusik (Web Audio API) ──────────────────────────────────────
// Pentatonische C-Dur-Melodie, 32 Schläge, ~17 s Loop
const MELODIE_NOTEN = [
    [523.25,1],[659.25,1],[783.99,2],   // C5 E5 G5
    [880.00,1],[783.99,1],[659.25,2],   // A5 G5 E5
    [659.25,1],[523.25,1],[587.33,2],   // E5 C5 D5
    [659.25,1],[783.99,1],[523.25,2],   // E5 G5 C5
    [440.00,1],[523.25,1],[659.25,2],   // A4 C5 E5
    [783.99,1],[659.25,1],[523.25,2],   // G5 E5 C5
    [587.33,1],[659.25,1],[783.99,2],   // D5 E5 G5
    [880.00,1],[659.25,1],[523.25,2],   // A5 E5 C5
];
const BASS_NOTEN = [
    [130.81,4],[196.00,4],[220.00,4],[174.61,4],
    [130.81,4],[196.00,4],[261.63,4],[196.00,4],
];
const AKKORD_NOTEN = [
    [[261.63,329.63,392.00],4], // C
    [[196.00,246.94,293.66],4], // G
    [[220.00,261.63,329.63],4], // Am
    [[174.61,220.00,261.63],4], // F
    [[261.63,329.63,392.00],4], // C
    [[196.00,246.94,293.66],4], // G
    [[261.63,329.63,392.00],4], // C
    [[196.00,246.94,293.66],4], // G
];
const BPM   = 108;
const SCHLAG = 60 / BPM;

let audioCtx     = null;
let masterGain   = null;
let melIdx = 0, bassIdx = 0, akkIdx = 0;
let melZeit = 0, bassZeit = 0, akkZeit = 0;

function musikStarten() {
    if (audioCtx) {
        // AudioContext nach Browser-Pause fortsetzen
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
    }
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();

    // Kompressor für wärmeren Klang
    const komp = audioCtx.createDynamicsCompressor();
    komp.threshold.value = -18;
    komp.ratio.value     = 4;
    komp.attack.value    = 0.05;
    komp.release.value   = 0.3;

    masterGain.connect(komp);
    komp.connect(audioCtx.destination);
    masterGain.gain.setValueAtTime(0.14, audioCtx.currentTime);

    const jetzt = audioCtx.currentTime + 0.15;
    melZeit = bassZeit = akkZeit = jetzt;
    musikSchedulieren();
}

function bellen() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [[0, 0.14], [0.22, 0.11]].forEach(([delay, dur]) => {
        // Sawtooth + formant filter = "woof" attack
        const osc  = audioCtx.createOscillator();
        const filt = audioCtx.createBiquadFilter();
        const env  = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(310, t + delay);
        osc.frequency.exponentialRampToValueAtTime(110, t + delay + dur);
        filt.type = 'bandpass';
        filt.frequency.setValueAtTime(1700, t + delay);
        filt.frequency.exponentialRampToValueAtTime(480, t + delay + dur);
        filt.Q.value = 2.8;
        env.gain.setValueAtTime(0, t + delay);
        env.gain.linearRampToValueAtTime(0.6, t + delay + 0.010);
        env.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
        osc.connect(filt); filt.connect(env); env.connect(audioCtx.destination);
        osc.start(t + delay); osc.stop(t + delay + dur + 0.02);

        // Low body thump for depth
        const osc2 = audioCtx.createOscillator();
        const env2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(190, t + delay);
        osc2.frequency.exponentialRampToValueAtTime(75, t + delay + dur * 0.75);
        env2.gain.setValueAtTime(0, t + delay);
        env2.gain.linearRampToValueAtTime(0.45, t + delay + 0.008);
        env2.gain.exponentialRampToValueAtTime(0.001, t + delay + dur * 0.85);
        osc2.connect(env2); env2.connect(audioCtx.destination);
        osc2.start(t + delay); osc2.stop(t + delay + dur + 0.02);
    });
}

function musikNote(hz, start, dauer, lautst, typ, tiefpass = 0) {
    const osc  = audioCtx.createOscillator();
    const env  = audioCtx.createGain();
    const att  = Math.min(0.04, dauer * 0.08);
    const rel  = Math.min(0.12, dauer * 0.25);

    osc.type = typ;
    osc.frequency.setValueAtTime(hz, start);
    env.gain.setValueAtTime(0, start);
    env.gain.linearRampToValueAtTime(lautst, start + att);
    env.gain.setValueAtTime(lautst * 0.75, start + dauer - rel);
    env.gain.linearRampToValueAtTime(0, start + dauer);

    if (tiefpass) {
        const f = audioCtx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(tiefpass, start);
        f.Q.value = 0.8;
        osc.connect(f); f.connect(env);
    } else {
        osc.connect(env);
    }
    env.connect(masterGain);
    osc.start(start);
    osc.stop(start + dauer + 0.02);
}

function musikSchedulieren() {
    if (!audioCtx) return;
    const bis = audioCtx.currentTime + 0.55;

    while (melZeit < bis) {
        const [hz, s] = MELODIE_NOTEN[melIdx];
        musikNote(hz, melZeit, s * SCHLAG * 0.82, 0.16, 'triangle');
        melZeit += s * SCHLAG;
        melIdx   = (melIdx + 1) % MELODIE_NOTEN.length;
    }
    while (bassZeit < bis) {
        const [hz, s] = BASS_NOTEN[bassIdx];
        musikNote(hz, bassZeit, s * SCHLAG * 0.65, 0.18, 'sine');
        bassZeit += s * SCHLAG;
        bassIdx   = (bassIdx + 1) % BASS_NOTEN.length;
    }
    while (akkZeit < bis) {
        const [noten, s] = AKKORD_NOTEN[akkIdx];
        const d = s * SCHLAG * 0.88;
        for (const hz of noten) musikNote(hz, akkZeit, d, 0.055, 'sine', 700);
        akkZeit += s * SCHLAG;
        akkIdx   = (akkIdx + 1) % AKKORD_NOTEN.length;
    }
    setTimeout(musikSchedulieren, 200);
}

// ── Spielzustand ───────────────────────────────────────────────────────────
let zustand, leben, punkte, ziel, buchstaben, partikel, spieler, tasten, aktiverLevel;
let buchstabenSchlange = [];
let flashTimer   = 0;
let flashTyp     = '';
let letzterTreffer = '';
let spawnTimer   = 50;

function mischen(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

function schlangeNeuFuellen() { buchstabenSchlange = mischen([...ALPHABET]); }
function naechsterBuchstabe() {
    if (!buchstabenSchlange.length) schlangeNeuFuellen();
    return buchstabenSchlange.pop();
}

let zahlenSchlange = [];
function zahlenNeuFuellen() { zahlenSchlange = mischen([...ZAHLEN]); }
function naechsteZahl() {
    if (!zahlenSchlange.length) zahlenNeuFuellen();
    return zahlenSchlange.pop();
}
function naechstesZiel() {
    return aktiverLevel === 1 ? naechsterBuchstabe() : naechsteZahl();
}

function zielSetzen(t) {
    ziel = t;
    const leuchtet = punkte < GLOW_UNTIL;
    for (const b of buchstaben) {
        if (!b.weg) {
            b.istZiel  = b.buchstabe === ziel;
            b.leuchtet = leuchtet && b.istZiel;
        }
    }
}

function spielerErstellen() {
    return { x: W / 2, y: GROUND, vy: 0, aufBoden: true,
             richtung: 1, beinPhase: 0, blinzelTimer: 0 };
}

function spielStart() {
    musikStarten();
    aktiverLevel   = 1;
    leben          = 3;
    punkte         = 0;
    buchstaben     = [];
    partikel       = [];
    tasten         = {};
    spieler        = spielerErstellen();
    flashTimer     = 0;
    spawnTimer     = 50;
    schlangeNeuFuellen();
    ziel    = naechsterBuchstabe();
    zustand = 'spielen';
    setTimeout(() => buchstabeAnsagen(ziel), 300);
}

function level2Starten() {
    aktiverLevel   = 2;
    punkte         = 0;
    buchstaben     = [];
    partikel       = [];
    spieler        = spielerErstellen();
    flashTimer     = 0;
    spawnTimer     = 50;
    zahlenNeuFuellen();
    ziel    = naechsteZahl();
    zustand = 'spielen';
    setTimeout(() => buchstabeAnsagen(ziel), 300);
}

// ── Buchstaben/Zahlen-Spawn (kontinuierlich, Geschwindigkeit steigt) ───────
function buchstabenSpawnen() {
    spawnTimer--;
    if (spawnTimer > 0) return;

    const menge      = aktiverLevel === 1 ? ALPHABET : ZAHLEN;
    const farbArray  = aktiverLevel === 1 ? FARBEN : ZAHLEN_FARBEN;

    const intervall   = Math.max(28, 52 - Math.floor(punkte * 1.1));
    spawnTimer        = intervall + Math.floor(Math.random() * 22);
    const basisGeschw = 1.0 + punkte * 0.065;

    const maxBuchstaben = punkte < 8 ? 3 : punkte < 16 ? 4 : 5;
    const aktivAnzahl   = buchstaben.filter(b => !b.weg).length;
    if (aktivAnzahl >= maxBuchstaben) return;

    const zielSichtbar = buchstaben.some(b => !b.weg && b.istZiel);

    let buchstabe;
    if (!zielSichtbar) {
        buchstabe = ziel;
    } else {
        const falsche = menge.filter(l => l !== ziel);
        buchstabe     = falsche[Math.floor(Math.random() * falsche.length)];
    }

    const x        = 68 + Math.random() * (W - 136);
    const leuchtet = punkte < GLOW_UNTIL;
    const vy       = Math.min(basisGeschw + Math.random() * 0.4, 3.8);

    buchstaben.push({
        buchstabe, x, y: -LETTER_R, vy,
        istZiel  : buchstabe === ziel,
        farbe    : farbArray[menge.indexOf(buchstabe) % farbArray.length],
        leuchtet : leuchtet && buchstabe === ziel,
        glowT    : 0,
        weg      : false
    });
}

// ── Partikel ───────────────────────────────────────────────────────────────
function explosion(x, y, farbe, n = 18) {
    for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i / n) + Math.random() * 0.5;
        const s = 3 + Math.random() * 5;
        partikel.push({
            x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
            farbe, r: 5 + Math.random() * 7,
            leben: 1, abbau: 0.018 + Math.random() * 0.015
        });
    }
}

// ── Update ─────────────────────────────────────────────────────────────────
function update() {
    if (zustand !== 'spielen') return;

    if (flashTimer > 0) {
        flashTimer--;
        if (flashTimer === 0 && flashTyp === 'gut') {
            buchstabeAnsagen(ziel);
        }
        partikelUpdate();
        buchstabenSpawnen();
        buchstabenBewegen();
        spielerPhysik();
        return;
    }

    spielerPhysik();
    buchstabenSpawnen();

    const cx = spieler.x;
    const cy = spieler.y - PH / 2;
    for (const b of buchstaben) {
        if (b.weg) continue;
        const dx = Math.abs(b.x - cx);
        const dy = Math.abs(b.y - cy);
        if (dx < PW / 2 + LETTER_R * 0.68 && dy < PH / 2 + LETTER_R * 0.65) {
            b.weg = true;
            if (b.istZiel) {
                letzterTreffer = ziel;
                punkte++;
                explosion(b.x, b.y, b.farbe, 22);
                explosion(spieler.x, spieler.y - PH / 2, '#FFD700', 12);
                if (punkte >= 15) {
                    if (aktiverLevel === 1) {
                        zustand = 'levelzwischen';
                        sprechen('Super! Buchstaben geschafft! Jetzt kommen Zahlen!', 0.88, 1.5);
                    } else {
                        zustand = 'gewonnen';
                        sprechen('Wahnsinn! Du hast alle Zahlen gefunden!', 0.9, 1.6);
                    }
                    return;
                }
                superSprechen();
                zielSetzen(naechstesZiel());
                flashTimer = 90;
                flashTyp   = 'gut';
            } else {
                leben--;
                explosion(b.x, b.y, '#FF4444', 14);
                if (leben <= 0) {
                    zustand = 'spielende';
                    sprechen('Schade! Versuch es nochmal!');
                    return;
                }
                sprechen(`Nein! Such ${ziel}!`, 0.82, 1.1);
                flashTimer = 55;
                flashTyp   = 'schlecht';
            }
            break;
        }
    }

    buchstabenBewegen();
    partikelUpdate();
}

function spielerPhysik() {
    const spd = 5.5;
    if (tasten['ArrowLeft']  || tasten['a'] || tasten['A']) { spieler.x -= spd; spieler.richtung = -1; }
    if (tasten['ArrowRight'] || tasten['d'] || tasten['D']) { spieler.x += spd; spieler.richtung =  1; }
    if ((tasten['ArrowUp'] || tasten[' '] || tasten['w'] || tasten['W']) && spieler.aufBoden) {
        spieler.vy = JUMP_V;
        spieler.aufBoden = false;
        bellen();
    }
    spieler.x = Math.max(PW / 2, Math.min(W - PW / 2, spieler.x));
    spieler.vy += GRAVITY;
    spieler.y  += spieler.vy;
    if (spieler.y >= GROUND) { spieler.y = GROUND; spieler.vy = 0; spieler.aufBoden = true; }
    const laeuft = tasten['ArrowLeft'] || tasten['ArrowRight'] || tasten['a'] || tasten['d'];
    if (spieler.aufBoden && laeuft) spieler.beinPhase += 0.21;
    spieler.blinzelTimer = (spieler.blinzelTimer + 1) % 180;
}

function buchstabenBewegen() {
    for (const b of buchstaben) {
        if (b.weg) continue;
        b.y    += b.vy;
        b.glowT += 0.06;
        if (b.y > H + LETTER_R) b.weg = true;
    }
    buchstaben = buchstaben.filter(b => !b.weg);
    if (buchstaben.length > 22) buchstaben = buchstaben.slice(-22);
}

function partikelUpdate() {
    for (const p of partikel) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.leben -= p.abbau;
    }
    partikel = partikel.filter(p => p.leben > 0);
}

// ── Zeichnen-Hilfsfunktionen ───────────────────────────────────────────────
function rundesRechteck(x, y, b, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + b - r, y);
    ctx.quadraticCurveTo(x + b, y, x + b, y + r);
    ctx.lineTo(x + b, y + h - r);
    ctx.quadraticCurveTo(x + b, y + h, x + b - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function sternZeichnen(mx, my, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const ao = { x: mx + r       * Math.cos((i*4*Math.PI/5) - Math.PI/2),
                     y: my + r       * Math.sin((i*4*Math.PI/5) - Math.PI/2) };
        const ai = { x: mx + r * 0.4 * Math.cos(((i*4+2)*Math.PI/5) - Math.PI/2),
                     y: my + r * 0.4 * Math.sin(((i*4+2)*Math.PI/5) - Math.PI/2) };
        i === 0 ? ctx.moveTo(ao.x, ao.y) : ctx.lineTo(ao.x, ao.y);
        ctx.lineTo(ai.x, ai.y);
    }
    ctx.closePath();
    ctx.fill();
}

// ── Hintergrund ────────────────────────────────────────────────────────────
function hintergrundZeichnen() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (aktiverLevel === 2) {
        // Sonnenuntergang für Level 2
        grad.addColorStop(0,    '#7B1FA2');
        grad.addColorStop(0.35, '#E91E63');
        grad.addColorStop(0.7,  '#FF9800');
        grad.addColorStop(1,    '#FFCC80');
    } else {
        grad.addColorStop(0,    '#4FC3F7');
        grad.addColorStop(0.55, '#81D4FA');
        grad.addColorStop(1,    '#B3E5FC');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const wolkenAlpha = aktiverLevel === 2 ? 0.55 : 1;
    wolkeZeichnen(90,  75, 1.0,  0.92 * wolkenAlpha);
    wolkeZeichnen(320, 45, 0.75, 0.88 * wolkenAlpha);
    wolkeZeichnen(580, 90, 0.9,  0.85 * wolkenAlpha);
    wolkeZeichnen(730, 40, 0.6,  0.8  * wolkenAlpha);

    const bg = ctx.createLinearGradient(0, GROUND + PH, 0, H);
    if (aktiverLevel === 2) {
        bg.addColorStop(0,    '#388E3C');
        bg.addColorStop(0.25, '#2E7D32');
        bg.addColorStop(1,    '#1B5E20');
    } else {
        bg.addColorStop(0,    '#66BB6A');
        bg.addColorStop(0.25, '#4CAF50');
        bg.addColorStop(1,    '#2E7D32');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, GROUND + PH, W, H - GROUND - PH);

    ctx.strokeStyle = aktiverLevel === 2 ? '#558B2F' : '#81C784';
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + PH);
    ctx.lineTo(W, GROUND + PH);
    ctx.stroke();
}

function wolkeZeichnen(x, y, groesse, deckkraft) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(groesse, groesse);
    ctx.fillStyle = `rgba(255,255,255,${deckkraft})`;
    for (const [cx, cy, r] of [
        [0,0,34],[30,-8,25],[-30,-5,23],[54,4,19],[-52,4,17],[18,-20,19],[-14,-18,17]
    ]) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// ── Marshall von PAW Patrol (Dalmatiner, Feuerwehr) ───────────────────────
const M = {
    fell      : '#FFFFFF',
    fleck     : '#1C1C1C',
    uniform   : '#D32F2F',
    helmRot   : '#C62828',
    helmDunkel: '#7B0000',
    auge      : '#6D4C41',
    augeInnen : '#1A0800',
    nase      : '#1A1A1A',
    mund      : '#D47070',
    gold      : '#FFD700',
};

function spielerZeichnen() {
    const s       = spieler;
    const schwung = s.aufBoden ? Math.sin(s.beinPhase) * 16 : 0;
    const blinzel = s.blinzelTimer > 170;

    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.richtung === -1) ctx.scale(-1, 1);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 3, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    marshallSchwanz(s.beinPhase);

    // Hinterbein
    ctx.save();
    ctx.translate(-10, -12);
    ctx.rotate(-schwung * Math.PI / 180 * 0.8);
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(0, -6, 6, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(2, -2, 3, 2, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(2, 8, 8, 5, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    marshallKoerper();

    // Vorderarm (roter Ärmel)
    ctx.save();
    ctx.translate(14, -42);
    ctx.rotate(0.3 - schwung * Math.PI / 180 * 0.5);
    ctx.fillStyle = M.uniform;
    ctx.beginPath(); ctx.ellipse(0, -3, 6, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M.fell;
    ctx.beginPath(); ctx.ellipse(-1, 9, 7, 5, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Ohren vor Kopf zeichnen (damit Kopf sie überlappt)
    marshallOhren(s.beinPhase);
    marshallKopf(blinzel);

    ctx.restore();
}

function marshallSchwanz(phase) {
    const w = Math.sin(phase * 1.8) * 9;
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(-14, -38);
    ctx.quadraticCurveTo(-26 + w * 0.5, -54, -20 + w, -68);
    ctx.quadraticCurveTo(-15 + w, -66, -12 + w * 0.4, -54);
    ctx.quadraticCurveTo(-15 + w * 0.2, -42, -14, -38);
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-18 + w * 0.4, -56, 4, 2.5, 0.4, 0, Math.PI * 2); ctx.fill();
}

function marshallKoerper() {
    // Weißer Fell-Körper
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.ellipse(0, -34, 18, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Rote Feuerwehr-Uniform
    ctx.fillStyle = M.uniform;
    ctx.beginPath();
    ctx.ellipse(0, -40, 14, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    // Weißes Bauchfeld
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.ellipse(0, -29, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Knochen-Abzeichen (goldenes Badge)
    knochenAbzeichen(0, -46, 6);

    // Dalmatiner-Flecken auf Körper
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-11, -46, 5, 3.5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 10, -29, 4, 3,    0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( -6, -22, 3.5, 2.5, 0.2, 0, Math.PI * 2); ctx.fill();
}

function knochenAbzeichen(x, y, s) {
    ctx.fillStyle = M.gold;
    rundesRechteck(x - s, y - s * 0.22, s * 2, s * 0.44, s * 0.2);
    ctx.fill();
    for (const [dx, dy] of [[-s, -s*0.32], [-s, s*0.32], [s, -s*0.32], [s, s*0.32]]) {
        ctx.beginPath(); ctx.arc(x + dx, y + dy, s * 0.38, 0, Math.PI * 2); ctx.fill();
    }
}

function marshallOhren(phase) {
    // Floppy hound ears — hängen seitlich am Kopf herunter
    const sw = Math.sin(phase * 0.8) * 2;

    // Linkes Ohr
    ctx.save();
    ctx.translate(-23, -70);
    ctx.rotate(-0.12 + sw * 0.012);
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.bezierCurveTo(-2, 6, -13, 18, -11, 34);
    ctx.bezierCurveTo(-9, 44, 2, 47, 7, 43);
    ctx.bezierCurveTo(12, 38, 12, 24, 9, 10);
    ctx.bezierCurveTo(8, 4, 7, 1, 5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(-1, 26, 4, 7, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Rechtes Ohr
    ctx.save();
    ctx.translate(23, -70);
    ctx.rotate(0.12 - sw * 0.012);
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.bezierCurveTo(2, 6, 13, 18, 11, 34);
    ctx.bezierCurveTo(9, 44, -2, 47, -7, 43);
    ctx.bezierCurveTo(-12, 38, -12, 24, -9, 10);
    ctx.bezierCurveTo(-8, 4, -7, 1, -5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse(1, 24, 4, 7, 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function marshallKopf(blinzel) {
    // Großer runder weißer Kopf
    ctx.fillStyle = M.fell;
    ctx.beginPath();
    ctx.arc(0, -66, 27, 0, Math.PI * 2);
    ctx.fill();

    // Dalmatiner-Flecken auf Kopf
    ctx.fillStyle = M.fleck;
    ctx.beginPath(); ctx.ellipse( 13, -76, 7, 5,   0.5,  0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-15, -62, 5, 3.5,-0.3,  0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(  9, -54, 4, 3,   0.4,  0, Math.PI * 2); ctx.fill();

    // Helles Gesichtsfeld (Schnauzenbereich)
    ctx.fillStyle = '#FFFAFA';
    ctx.beginPath();
    ctx.ellipse(0, -58, 20, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── FEUERWEHRHELM ─────────────────────────────────────────────────────
    // Rote Kuppel — bedeckt obere Kopfhälfte
    ctx.fillStyle = M.helmRot;
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.closePath();
    ctx.fill();

    // Weißer Querstreifen (clipped auf Kuppel)
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(-30, -74, 60, 8);
    ctx.restore();

    // Dunkler Helmrand
    ctx.strokeStyle = M.helmDunkel;
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.arc(0, -66, 29, Math.PI + 0.1, 2 * Math.PI - 0.1);
    ctx.stroke();

    // Vorderschirm (breiter, flacher Feuerwehrbrim)
    ctx.fillStyle = M.helmDunkel;
    ctx.beginPath();
    ctx.ellipse(6, -54, 30, 6.5, -0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = M.helmRot;
    ctx.beginPath();
    ctx.ellipse(5, -55.5, 28, 5, -0.08, 0, Math.PI * 2);
    ctx.fill();

    // "03" auf Helm
    ctx.fillStyle    = M.gold;
    ctx.font         = 'bold 13px Arial';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('03', 1, -81);

    // ── AUGEN ─────────────────────────────────────────────────────────────
    if (blinzel) {
        ctx.strokeStyle = M.augeInnen;
        ctx.lineWidth   = 3;
        ctx.lineCap     = 'round';
        ctx.beginPath(); ctx.moveTo(-16, -60); ctx.lineTo(-7, -60); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(  7, -60); ctx.lineTo(16, -60); ctx.stroke();
    } else {
        // Linkes Auge — groß, ausdrucksstark
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(-11, -60, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.auge;
        ctx.beginPath(); ctx.ellipse(-11, -60, 6,   7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.augeInnen;
        ctx.beginPath(); ctx.arc(-11, -60, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(-8.5, -64, 2.8, 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-14, -61.5, 1.2, 0, Math.PI * 2); ctx.fill();

        // Rechtes Auge
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(11, -60, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.auge;
        ctx.beginPath(); ctx.ellipse(11, -60, 6,   7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = M.augeInnen;
        ctx.beginPath(); ctx.arc(11, -60, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.ellipse(13.5, -64, 2.8, 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -61.5, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // ── SCHNAUZE ──────────────────────────────────────────────────────────
    // Weißer Schnauzenvorsprung
    ctx.fillStyle = '#FFF0F0';
    ctx.beginPath();
    ctx.ellipse(0, -47, 13, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    // Große schwarze Nase
    ctx.fillStyle = M.nase;
    ctx.beginPath();
    ctx.ellipse(0, -54, 6, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(-2, -56, 2, 1.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Philtrum
    ctx.strokeStyle = M.nase;
    ctx.lineWidth   = 1.8;
    ctx.lineCap     = 'round';
    ctx.beginPath(); ctx.moveTo(0, -49); ctx.lineTo(0, -44); ctx.stroke();

    // Lächeln
    ctx.strokeStyle = M.mund;
    ctx.lineWidth   = 2.2;
    ctx.beginPath();
    ctx.moveTo(-9, -44);
    ctx.quadraticCurveTo(0, -38, 9, -44);
    ctx.stroke();
}

// ── Buchstaben ─────────────────────────────────────────────────────────────
function buchstabenZeichnen() {
    for (const b of buchstaben) {
        if (b.weg) continue;
        ctx.save();
        ctx.translate(b.x, b.y);
        if (b.leuchtet) {
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur  = 28 + Math.sin(b.glowT) * 16;
        }
        ctx.fillStyle = b.farbe;
        ctx.beginPath();
        ctx.arc(0, 0, LETTER_R, 0, Math.PI * 2);
        ctx.fill();
        if (b.leuchtet) {
            ctx.strokeStyle = `rgba(255,220,0,${0.7 + Math.sin(b.glowT) * 0.3})`;
            ctx.lineWidth   = 4.5;
        } else {
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth   = 2;
        }
        ctx.shadowBlur    = 0;
        ctx.stroke();
        ctx.fillStyle     = 'white';
        ctx.font          = b.buchstabe.length > 1 ? 'bold 28px Arial' : 'bold 42px Arial';
        ctx.textAlign     = 'center';
        ctx.textBaseline  = 'middle';
        ctx.fillText(b.buchstabe, 0, 2);
        ctx.restore();
    }
}

// ── HUD ────────────────────────────────────────────────────────────────────
function anzeigeZeichnen() {
    // Zielbox – nur in den ersten drei Runden
    if (punkte < 3) {
        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        rundesRechteck(W / 2 - 155, 8, 310, 72, 16);
        ctx.fill();
        ctx.fillStyle    = '#FFD700';
        ctx.font         = 'bold 17px Arial';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(aktiverLevel === 1 ? 'Finde den Buchstaben:' : 'Finde die Zahl:', W / 2, 31);
        ctx.fillStyle = 'white';
        ctx.font      = 'bold 38px Arial';
        ctx.fillText(ziel, W / 2, 68);
    }

    // Herzen
    for (let i = 0; i < 3; i++) {
        ctx.font      = '30px Arial';
        ctx.textAlign = 'left';
        ctx.fillStyle = i < leben ? '#FF4757' : '#555';
        ctx.fillText('♥', 14 + i * 40, 46);
    }

    // Punkte + Geschwindigkeitsanzeige
    const level = Math.floor(punkte / 3) + 1;
    ctx.fillStyle   = '#E91E8C';
    ctx.font        = 'bold 20px Arial';
    ctx.textAlign   = 'right';
    ctx.fillText(`🦴 ${punkte}`, W - 14, 38);
    ctx.fillStyle   = 'rgba(255,255,255,0.7)';
    ctx.font        = '13px Arial';
    ctx.fillText(`Stufe ${level}`, W - 14, 57);

    // Leuchthinweis
    if (punkte < GLOW_UNTIL) {
        const hinweis = aktiverLevel === 1
            ? '✨ Der richtige Buchstabe leuchtet golden auf!'
            : '✨ Die richtige Zahl leuchtet golden auf!';
        ctx.fillStyle    = 'rgba(255,200,0,0.72)';
        ctx.font         = '14px Arial';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(hinweis, W / 2, H - 16);
    }
}

// ── Flash-Overlay ──────────────────────────────────────────────────────────
function flashZeichnen() {
    if (flashTimer <= 0) return;
    const alpha = Math.min(1, flashTimer / 30) * 0.35;
    if (flashTyp === 'gut') {
        ctx.fillStyle = `rgba(0,200,80,${alpha})`;
        ctx.fillRect(0, 0, W, H);
        if (flashTimer > 55) {
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.font         = 'bold 72px Arial';
            ctx.fillStyle    = 'white';
            ctx.fillText(`🦴 SUPER! 🦴`, W / 2, H / 2 - 18);
            ctx.font         = 'bold 54px Arial';
            ctx.fillStyle    = '#FFD700';
            ctx.fillText(letzterTreffer, W / 2, H / 2 + 46);
        }
    } else {
        ctx.fillStyle = `rgba(220,0,0,${alpha})`;
        ctx.fillRect(0, 0, W, H);
        if (flashTimer > 28) {
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.font         = 'bold 58px Arial';
            ctx.fillStyle    = 'white';
            ctx.fillText('Ups! ❌', W / 2, H / 2);
        }
    }
}

// ── Partikel ───────────────────────────────────────────────────────────────
function partikelZeichnen() {
    for (const p of partikel) {
        ctx.save();
        ctx.globalAlpha = p.leben;
        ctx.fillStyle   = p.farbe;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// ── Eingabe ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    tasten[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') {
        if (zustand === 'start' || zustand === 'spielende' || zustand === 'gewonnen') spielStart();
        if (zustand === 'levelzwischen') level2Starten();
    }
    if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { tasten[e.key] = false; });

let touchX0 = null;
canvas.addEventListener('touchstart', e => {
    touchX0 = e.touches[0].clientX;
    if (zustand === 'start' || zustand === 'spielende' || zustand === 'gewonnen') { spielStart(); return; }
    if (zustand === 'levelzwischen') { level2Starten(); return; }
    if (zustand === 'spielen' && spieler.aufBoden) { spieler.vy = JUMP_V; spieler.aufBoden = false; bellen(); }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
    if (zustand !== 'spielen' || touchX0 === null) return;
    const dx = e.touches[0].clientX - touchX0;
    if (Math.abs(dx) > 8) {
        spieler.x        += dx * 0.12;
        spieler.richtung  = dx > 0 ? 1 : -1;
        touchX0           = e.touches[0].clientX;
    }
}, { passive: true });

canvas.addEventListener('click', () => {
    if (zustand === 'start' || zustand === 'spielende' || zustand === 'gewonnen') spielStart();
    if (zustand === 'levelzwischen') level2Starten();
});

// ── Hauptschleife ──────────────────────────────────────────────────────────
zustand    = 'start';
tasten     = {};

function zeichnen() {
    ctx.clearRect(0, 0, W, H);
